{
  "backend": {
    "name": "github",
    "repo": "wuyonglv/swiftalyn-com",
    "branch": "main",
    "base_url": "https://swiftalyn-cms-auth.swiftalyn-cms.workers.dev",
    "auth_endpoint": "auth"
  },
  "local_backend": true,
  "locale": "zh_Hans",
  "media_folder": "images/uploads",
  "public_folder": "images/uploads",
  "collections": [
    {
      "name": "site",
      "label": "网站内容",
      "editor": {
        "preview": false
      },
      "files": [
        {
          "name": "home",
          "label": "首页文案",
          "file": "content/home.json",
          "fields": [
            {
              "name": "hero",
              "label": "首页横幅",
              "widget": "object",
              "fields": [
                {
                  "name": "tagline",
                  "label": "标题（支持换行）",
                  "widget": "text"
                }
              ]
            },
            {
              "name": "about",
              "label": "关于我们",
              "widget": "object",
              "fields": [
                {
                  "name": "title",
                  "label": "模块标题",
                  "widget": "string"
                },
                {
                  "name": "items",
                  "label": "内容",
                  "widget": "list",
                  "min": 3,
                  "max": 3,
                  "fields": [
                    {
                      "name": "title",
                      "label": "标题",
                      "widget": "string"
                    },
                    {
                      "name": "text",
                      "label": "正文",
                      "widget": "text"
                    }
                  ]
                }
              ]
            },
            {
              "name": "partners",
              "label": "合作伙伴",
              "widget": "list",
              "min": 2,
              "max": 2,
              "fields": [
                {
                  "name": "title",
                  "label": "标题",
                  "widget": "string"
                },
                {
                  "name": "text",
                  "label": "正文",
                  "widget": "text"
                }
              ]
            },
            {
              "name": "footer",
              "label": "页脚",
              "widget": "object",
              "fields": [
                {
                  "name": "copyright",
                  "label": "版权文字",
                  "widget": "string"
                }
              ]
            }
          ]
        },
        {
          "name": "products",
          "label": "精选商品",
          "file": "content/products.json",
          "fields": [
            {
              "name": "title",
              "label": "模块标题",
              "widget": "string"
            },
            {
              "name": "emptyMessage",
              "label": "无商品提示",
              "widget": "string"
            },
            {
              "name": "products",
              "label": "商品",
              "widget": "list",
              "summary": "{{fields.name}}",
              "fields": [
                {
                  "name": "id",
                  "label": "唯一 ID",
                  "widget": "string"
                },
                {
                  "name": "name",
                  "label": "商品名称",
                  "widget": "text"
                },
                {
                  "name": "price",
                  "label": "价格",
                  "widget": "number",
                  "value_type": "float",
                  "min": 0,
                  "step": 0.01
                },
                {
                  "name": "currency",
                  "label": "币种",
                  "widget": "select",
                  "options": [
                    "GBP",
                    "USD",
                    "EUR"
                  ],
                  "default": "GBP"
                },
                {
                  "name": "image",
                  "label": "商品图片",
                  "widget": "image",
                  "required": false
                },
                {
                  "name": "imageAlt",
                  "label": "图片说明",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "description",
                  "label": "商品描述",
                  "widget": "text",
                  "required": false
                },
                {
                  "name": "href",
                  "label": "本站详情页路径",
                  "widget": "string",
                  "required": false
                }
              ]
            }
          ]
        },
        {
          "name": "contact",
          "label": "Contact Us 联系我们",
          "file": "content/contact.json",
          "fields": [
            {
              "name": "title",
              "label": "模块标题",
              "widget": "string"
            },
            {
              "name": "infoTitle",
              "label": "联系信息标题",
              "widget": "string"
            },
            {
              "name": "company",
              "label": "公司名称",
              "widget": "string"
            },
            {
              "name": "address",
              "label": "公司地址",
              "widget": "text"
            },
            {
              "name": "phone",
              "label": "联系电话",
              "widget": "string"
            },
            {
              "name": "email",
              "label": "展示邮箱",
              "widget": "string"
            },
            {
              "name": "hoursTitle",
              "label": "营业时间标题",
              "widget": "string"
            },
            {
              "name": "hours",
              "label": "每周营业时间",
              "widget": "list",
              "min": 7,
              "max": 7,
              "summary": "{{fields.day}}",
              "fields": [
                {
                  "name": "day",
                  "label": "星期",
                  "widget": "select",
                  "options": [
                    "Monday",
                    "Tuesday",
                    "Wednesday",
                    "Thursday",
                    "Friday",
                    "Saturday",
                    "Sunday"
                  ]
                },
                {
                  "name": "open",
                  "label": "开始时间（HH:MM）",
                  "widget": "string",
                  "pattern": [
                    "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "请填写 09:00 这样的 24 小时时间"
                  ]
                },
                {
                  "name": "close",
                  "label": "结束时间（HH:MM）",
                  "widget": "string",
                  "pattern": [
                    "^([01][0-9]|2[0-3]):[0-5][0-9]$",
                    "请填写 17:00 这样的 24 小时时间"
                  ]
                },
                {
                  "name": "closed",
                  "label": "当天休息",
                  "widget": "boolean",
                  "default": false
                }
              ]
            },
            {
              "name": "mapAddress",
              "label": "地图地址 / 导航说明",
              "widget": "string"
            },
            {
              "name": "latitude",
              "label": "地图纬度",
              "widget": "number",
              "value_type": "float",
              "min": -90,
              "max": 90,
              "step": 1e-07
            },
            {
              "name": "longitude",
              "label": "地图经度",
              "widget": "number",
              "value_type": "float",
              "min": -180,
              "max": 180,
              "step": 1e-07
            },
            {
              "name": "zoom",
              "label": "地图缩放级别",
              "widget": "number",
              "value_type": "int",
              "min": 1,
              "max": 20
            },
            {
              "name": "formTitle",
              "label": "表单标题 / 展开按钮文字",
              "widget": "string"
            },
            {
              "name": "recipientEmail",
              "label": "表单收件邮箱",
              "widget": "string",
              "hint": "更换后需要在新邮箱中完成 FormSubmit 验证，才能接收表单邮件。"
            },
            {
              "name": "subject",
              "label": "表单邮件主题",
              "widget": "string"
            }
          ]
        }
      ]
    }
  ]
}
